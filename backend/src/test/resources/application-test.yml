# Almost every test logs in from 127.0.0.1 and the Spring context (with the limiter) is shared
# between test classes, so the production auth limits would trip. LoginRateLimitTests and
# AuthEndpointRateLimitTests set the real limits themselves.
app:
  rate-limit:
    login:
      username-failures:
        capacity: 1000000
      client-ip:
        capacity: 1000000
    register:
      client-ip:
        capacity: 1000000
    refresh:
      client-ip:
        capacity: 1000000
    logout:
      client-ip:
        capacity: 1000000
