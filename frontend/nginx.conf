server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # No HSTS: this server speaks plain HTTP. Add it at the TLS-terminating proxy.

    # Inherited by the API locations. Authorization and X-API-Version pass through by default.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS. With a variable in proxy_pass, nginx resolves "app" per request
    # instead of at startup, so it starts even when the app container is not up yet (or at all).
    # Without a URI part in proxy_pass, the request URI is passed to the app unchanged.
    resolver 127.0.0.11 valid=10s;
    set $upstream app:8080;

    # The API locations come before "/" so an API 404 is never turned into index.html
    location /api/ {
        proxy_pass http://$upstream;
    }

    location /auth/ {
        proxy_pass http://$upstream;
    }

    location /users {
        proxy_pass http://$upstream;
    }

    # A location with its own add_header drops the server-level ones, so the
    # security headers are repeated in the two below
    # Hashed filenames, so they never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routes fall back to this too, through the internal redirect of try_files
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
