<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1166 460" width="1166" height="460" role="img" aria-labelledby="title desc">
<title id="title">Login flow</title>
<desc id="desc">POST /auth/login: rate limit, credential check against users, a new session with a SHA-256 hashed refresh token in user_sessions, then an access JWT carrying the session id.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
  .label { font-size: 13px; font-weight: 600; dominant-baseline: middle; }
  .sub { font-size: 11px; dominant-baseline: middle; }
  .edge { font-size: 11px; }
  .edge.beside { text-anchor: start; }
  .pipe { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 11; animation: flow 0.8s linear infinite; }
  .flow.fail { opacity: 0.6; }
  .packet { filter: url(#glow); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .packet { display: none; } }
</style>
<defs>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g><path d="M210,50 L254,50" class="pipe" stroke="#262c36"/><path d="M444,50 L488,50" class="pipe" stroke="#262c36"/><path d="M583,80 L583,140" class="pipe" stroke="#262c36"/><path d="M678,170 L722,170" class="pipe" stroke="#262c36"/><path d="M912,170 L956,170" class="pipe" stroke="#262c36"/><path d="M583,200 L583,260" class="pipe" stroke="#262c36"/><path d="M678,290 L722,290" class="pipe" stroke="#262c36"/><path d="M912,290 L956,290" class="pipe" stroke="#262c36"/><path d="M583,320 L583,336 Q583,350 569,350 L363,350 Q349,350 349,364 L349,380" class="pipe" stroke="#262c36"/><path d="M254,410 L210,410" class="pipe" stroke="#262c36"/><path d="M115,380 L115,80" class="pipe" stroke="#262c36"/><path d="M678,50 L722,50" class="pipe" stroke="#262c36"/><path d="M488,170 L444,170" class="pipe" stroke="#262c36"/></g>
<g><path d="M210,50 L254,50" class="flow" stroke="#58a6ff"/><path d="M444,50 L488,50" class="flow" stroke="#58a6ff"/><path d="M583,80 L583,140" class="flow" stroke="#58a6ff"/><path d="M678,170 L722,170" class="flow" stroke="#58a6ff"/><path d="M912,170 L956,170" class="flow" stroke="#bc8cff"/><path d="M583,200 L583,260" class="flow" stroke="#58a6ff"/><path d="M678,290 L722,290" class="flow" stroke="#58a6ff"/><path d="M912,290 L956,290" class="flow" stroke="#bc8cff"/><path d="M583,320 L583,336 Q583,350 569,350 L363,350 Q349,350 349,364 L349,380" class="flow" stroke="#58a6ff"/><path d="M254,410 L210,410" class="flow" stroke="#58a6ff"/><path d="M115,380 L115,80" class="flow" stroke="#3fb950"/><path d="M678,50 L722,50" class="flow fail" stroke="#f85149"/><path d="M488,170 L444,170" class="flow fail" stroke="#f85149"/></g>
<g><rect x="20" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="115" y="51" class="label" fill="#e6edf3">Client</text><rect x="254" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="349" y="42" class="label" fill="#e6edf3">AuthController</text><text x="349" y="61" class="sub" fill="#9198a1">POST /auth/login</text><rect x="488" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="583" y="51" class="label" fill="#e6edf3">LoginRateLimiter</text><rect x="722" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="817" y="42" class="label" fill="#f85149">429 Too Many Requests</text><text x="817" y="61" class="sub" fill="#9198a1">too many attempts</text><rect x="254" y="140" width="190" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="349" y="162" class="label" fill="#f85149">401 Unauthorized</text><text x="349" y="181" class="sub" fill="#9198a1">bad credentials</text><rect x="488" y="140" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="583" y="162" class="label" fill="#e6edf3">AuthenticationManager</text><text x="583" y="181" class="sub" fill="#9198a1">BCrypt check</text><rect x="722" y="140" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="817" y="171" class="label" fill="#e6edf3">DatabaseUserDetailsService</text><path d="M956,148 a95,8 0 0 1 190,0 V192 a95,8 0 0 1 -190,0 Z" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><path d="M956,148 a95,8 0 0 0 190,0" fill="none" stroke="#bc8cff" stroke-width="1.5"/><text x="1051" y="175" class="label" fill="#e6edf3">users</text><rect x="488" y="260" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="583" y="282" class="label" fill="#e6edf3">UserSessionService</text><text x="583" y="301" class="sub" fill="#9198a1">createSession</text><rect x="722" y="260" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="817" y="282" class="label" fill="#e6edf3">Refresh token</text><text x="817" y="301" class="sub" fill="#9198a1">random, SHA-256 hashed</text><path d="M956,268 a95,8 0 0 1 190,0 V312 a95,8 0 0 1 -190,0 Z" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><path d="M956,268 a95,8 0 0 0 190,0" fill="none" stroke="#bc8cff" stroke-width="1.5"/><text x="1051" y="295" class="label" fill="#e6edf3">user_sessions</text><rect x="254" y="380" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="349" y="402" class="label" fill="#e6edf3">JWTService</text><text x="349" y="421" class="sub" fill="#9198a1">access JWT, 15 min</text><rect x="20" y="380" width="190" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="115" y="411" class="label" fill="#e6edf3">LoginResponse</text></g>
<g><text x="593" y="114" class="edge beside" fill="#9198a1">allowed</text><text x="593" y="234" class="edge beside" fill="#9198a1">authenticated</text><text x="593" y="339" class="edge beside" fill="#9198a1">session id → sid claim</text><text x="125" y="234" class="edge beside" fill="#9198a1">access + refresh token</text></g>
<g><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M210,50 L254,50" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0597;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.0597"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M444,50 L488,50" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0597;0.1194;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0597;0.1194"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M583,80 L583,140" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1194;0.1792;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1194;0.1792"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M678,170 L722,170" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1792;0.2389;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1792;0.2389"/></circle><circle r="5" fill="#bc8cff" class="packet" opacity="0"><animateMotion path="M912,170 L956,170" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2389;0.2986;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2389;0.2986"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M583,200 L583,260" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2986;0.3583;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2986;0.3583"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M678,290 L722,290" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3583;0.4181;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3583;0.4181"/></circle><circle r="5" fill="#bc8cff" class="packet" opacity="0"><animateMotion path="M912,290 L956,290" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4181;0.4778;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4181;0.4778"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M583,320 L583,336 Q583,350 569,350 L363,350 Q349,350 349,364 L349,380" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4778;0.6279;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4778;0.6279"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M254,410 L210,410" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6279;0.6876;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6279;0.6876"/></circle><circle r="5" fill="#3fb950" class="packet" opacity="0"><animateMotion path="M115,380 L115,80" dur="7.53s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6876;0.8407;1"/><animate attributeName="opacity" dur="7.53s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6876;0.8407"/></circle></g>
