<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 340" width="932" height="340" role="img" aria-labelledby="title desc">
<title id="title">Logout</title>
<desc id="desc">POST /auth/logout revokes the session of the given refresh token, current or already rotated, and always answers 204; the access token stays valid until it expires.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
  .label { font-size: 13px; font-weight: 600; dominant-baseline: middle; }
  .sub { font-size: 11px; dominant-baseline: middle; }
  .edge { font-size: 11px; }
  .edge.beside { text-anchor: start; }
  .pipe { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 11; animation: flow 0.8s linear infinite; }
  .flow.fail { opacity: 0.6; }
  .packet { filter: url(#glow); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .packet { display: none; } }
</style>
<defs>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g><path d="M210,50 L254,50" class="pipe" stroke="#262c36"/><path d="M444,50 L488,50" class="pipe" stroke="#262c36"/><path d="M583,80 L583,140" class="pipe" stroke="#262c36"/><path d="M583,200 L583,260" class="pipe" stroke="#262c36"/><path d="M488,170 L444,170" class="pipe" stroke="#262c36"/><path d="M254,170 L129,170 Q115,170 115,156 L115,80" class="pipe" stroke="#262c36"/><path d="M678,50 L722,50" class="pipe" stroke="#262c36"/></g>
<g><path d="M210,50 L254,50" class="flow" stroke="#58a6ff"/><path d="M444,50 L488,50" class="flow" stroke="#58a6ff"/><path d="M583,80 L583,140" class="flow" stroke="#58a6ff"/><path d="M583,200 L583,260" class="flow" stroke="#bc8cff"/><path d="M488,170 L444,170" class="flow" stroke="#58a6ff"/><path d="M254,170 L129,170 Q115,170 115,156 L115,80" class="flow" stroke="#3fb950"/><path d="M678,50 L722,50" class="flow fail" stroke="#f85149"/></g>
<g><rect x="20" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="115" y="51" class="label" fill="#e6edf3">Client</text><rect x="254" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="349" y="42" class="label" fill="#e6edf3">AuthController</text><text x="349" y="61" class="sub" fill="#9198a1">POST /auth/logout</text><rect x="488" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="583" y="51" class="label" fill="#e6edf3">AuthEndpointRateLimiter</text><rect x="722" y="20" width="190" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="817" y="42" class="label" fill="#f85149">429 Too Many Requests</text><text x="817" y="61" class="sub" fill="#9198a1">too many from this IP</text><rect x="488" y="140" width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="583" y="162" class="label" fill="#e6edf3">UserSessionService</text><text x="583" y="181" class="sub" fill="#9198a1">find by current or used hash</text><path d="M488,268 a95,8 0 0 1 190,0 V312 a95,8 0 0 1 -190,0 Z" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><path d="M488,268 a95,8 0 0 0 190,0" fill="none" stroke="#bc8cff" stroke-width="1.5"/><text x="583" y="295" class="label" fill="#e6edf3">user_sessions</text><rect x="254" y="140" width="190" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="349" y="162" class="label" fill="#e6edf3">204 No Content</text><text x="349" y="181" class="sub" fill="#9198a1">access JWT lives on ≤ 15 min</text></g>
<g><text x="593" y="114" class="edge beside" fill="#9198a1">allowed</text><text x="593" y="234" class="edge beside" fill="#9198a1">set revoked_at</text></g>
<g><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M210,50 L254,50" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1039;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.1039"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M444,50 L488,50" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1039;0.2078;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1039;0.2078"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M583,80 L583,140" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2078;0.3117;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2078;0.3117"/></circle><circle r="5" fill="#bc8cff" class="packet" opacity="0"><animateMotion path="M583,200 L583,260" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3117;0.4156;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3117;0.4156"/></circle><circle r="5" fill="#58a6ff" class="packet" opacity="0"><animateMotion path="M488,170 L444,170" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4156;0.5195;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4156;0.5195"/></circle><circle r="5" fill="#3fb950" class="packet" opacity="0"><animateMotion path="M254,170 L129,170 Q115,170 115,156 L115,80" dur="4.33s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5195;0.7229;1"/><animate attributeName="opacity" dur="4.33s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5195;0.7229"/></circle></g>
