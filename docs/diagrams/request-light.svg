<g><path d="M210,50 L254,50" class="flow" stroke="#0969da"/><path d="M444,50 L488,50" class="flow" stroke="#0969da"/><path d="M678,50 L722,50" class="flow" stroke="#0969da"/><path d="M912,50 L956,50" class="flow" stroke="#0969da"/><path d="M1051,80 L1051,140" class="flow" stroke="#0969da"/><path d="M956,170 L912,170" class="flow" stroke="#0969da"/><path d="M722,170 L678,170" class="flow" stroke="#0969da"/><path d="M488,170 L444,170" class="flow" stroke="#0969da"/><path d="M254,170 L129,170 Q115,170 115,156 L115,80" class="flow" stroke="#1a7f37"/><path d="M583,80 L583,96 Q583,110 597,110 L803,110 Q817,110 817,124 L817,140" class="flow fail" stroke="#cf222e"/><path d="M817,80 L817,140" class="flow fail" stroke="#cf222e"/><path d="M817,200 L817,260" class="flow fail" stroke="#cf222e"/></g>
<g><rect x="20" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="115" y="51" class="label" fill="#1f2328">Client</text><rect x="254" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="349" y="42" class="label" fill="#1f2328">JWTAuthenticationFilter</text><text x="349" y="61" class="sub" fill="#59636e">Authorization header</text><path d="M504,20 H662 L678,50 L662,80 H504 L488,50 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="583" y="51" class="label" fill="#1f2328">Bearer token?</text><path d="M738,20 H896 L912,50 L896,80 H738 L722,50 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="817" y="42" class="label" fill="#1f2328">Valid JWT?</text><text x="817" y="61" class="sub" fill="#59636e">signature + expiry</text><rect x="956" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1051" y="42" class="label" fill="#1f2328">CustomUserDetails</text><text x="1051" y="61" class="sub" fill="#59636e">from claims, no DB call</text><rect x="956" y="140" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="1051" y="171" class="label" fill="#1f2328">SecurityContext</text><path d="M738,140 H896 L912,170 L896,200 H738 L722,170 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="817" y="162" class="label" fill="#1f2328">Authenticated?</text><text x="817" y="181" class="sub" fill="#59636e">authorization rules</text><rect x="488" y="140" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="583" y="162" class="label" fill="#1f2328">Controller</text><text x="583" y="181" class="sub" fill="#59636e">@AuthenticationPrincipal</text><rect x="254" y="140" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="349" y="171" class="label" fill="#1f2328">200 OK</text><rect x="722" y="260" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="817" y="282" class="label" fill="#cf222e">401 Unauthorized</text><text x="817" y="301" class="sub" fill="#59636e">AuthenticationEntryPoint</text></g>
<g><text x="700" y="42" class="edge" fill="#59636e">yes</text><text x="934" y="42" class="edge" fill="#59636e">yes</text><text x="700" y="162" class="edge" fill="#59636e">yes</text><text x="593" y="99" class="edge beside" fill="#59636e">no</text><text x="827" y="114" class="edge beside" fill="#59636e">no</text><text x="827" y="234" class="edge beside" fill="#59636e">no</text></g>
