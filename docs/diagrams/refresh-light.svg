<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1166 460" width="1166" height="460" role="img" aria-labelledby="title desc">
<title id="title">Refresh token rotation</title>
<desc id="desc">POST /auth/refresh: the incoming token's hash must be the session's current one; the session gets a new refresh token, the old hash is kept as used, and a replayed used token revokes the whole session.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
  .label { font-size: 13px; font-weight: 600; dominant-baseline: middle; }
  .sub { font-size: 11px; dominant-baseline: middle; }
  .edge { font-size: 11px; }
  .edge.beside { text-anchor: start; }
  .pipe { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 11; animation: flow 0.8s linear infinite; }
  .flow.fail { opacity: 0.6; }
  .packet { filter: url(#glow); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .packet { display: none; } }
</style>
<defs>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g><path d="M210,50 L254,50" class="pipe" stroke="#e3e7ec"/><path d="M444,50 L488,50" class="pipe" stroke="#e3e7ec"/><path d="M583,80 L583,140" class="pipe" stroke="#e3e7ec"/><path d="M678,170 L722,170" class="pipe" stroke="#e3e7ec"/><path d="M817,200 L817,260" class="pipe" stroke="#e3e7ec"/><path d="M722,290 L678,290" class="pipe" stroke="#e3e7ec"/><path d="M583,320 L583,380" class="pipe" stroke="#e3e7ec"/><path d="M488,290 L444,290" class="pipe" stroke="#e3e7ec"/><path d="M254,290 L210,290" class="pipe" stroke="#e3e7ec"/><path d="M115,260 L115,80" class="pipe" stroke="#e3e7ec"/><path d="M678,50 L722,50" class="pipe" stroke="#e3e7ec"/><path d="M912,170 L956,170" class="pipe" stroke="#e3e7ec"/><path d="M1051,200 L1051,260" class="pipe" stroke="#e3e7ec"/><path d="M912,290 L956,290" class="pipe" stroke="#e3e7ec"/></g>
<g><path d="M210,50 L254,50" class="flow" stroke="#0969da"/><path d="M444,50 L488,50" class="flow" stroke="#0969da"/><path d="M583,80 L583,140" class="flow" stroke="#0969da"/><path d="M678,170 L722,170" class="flow" stroke="#0969da"/><path d="M817,200 L817,260" class="flow" stroke="#0969da"/><path d="M722,290 L678,290" class="flow" stroke="#0969da"/><path d="M583,320 L583,380" class="flow" stroke="#8250df"/><path d="M488,290 L444,290" class="flow" stroke="#0969da"/><path d="M254,290 L210,290" class="flow" stroke="#0969da"/><path d="M115,260 L115,80" class="flow" stroke="#1a7f37"/><path d="M678,50 L722,50" class="flow fail" stroke="#cf222e"/><path d="M912,170 L956,170" class="flow fail" stroke="#cf222e"/><path d="M1051,200 L1051,260" class="flow fail" stroke="#cf222e"/><path d="M912,290 L956,290" class="flow fail" stroke="#cf222e"/></g>
<g><rect x="20" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="115" y="51" class="label" fill="#1f2328">Client</text><rect x="254" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="349" y="42" class="label" fill="#1f2328">AuthController</text><text x="349" y="61" class="sub" fill="#59636e">POST /auth/refresh</text><rect x="488" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="583" y="51" class="label" fill="#1f2328">AuthEndpointRateLimiter</text><rect x="722" y="20" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="817" y="42" class="label" fill="#cf222e">429 Too Many Requests</text><text x="817" y="61" class="sub" fill="#59636e">too many from this IP</text><rect x="488" y="140" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="583" y="162" class="label" fill="#1f2328">UserSessionService</text><text x="583" y="181" class="sub" fill="#59636e">SHA-256 of incoming token</text><path d="M738,140 H896 L912,170 L896,200 H738 L722,170 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="817" y="162" class="label" fill="#1f2328">Current token?</text><text x="817" y="181" class="sub" fill="#59636e">user_sessions, row locked</text><rect x="956" y="140" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="1051" y="162" class="label" fill="#cf222e">Used before?</text><text x="1051" y="181" class="sub" fill="#59636e">reuse revokes the session</text><path d="M738,260 H896 L912,290 L896,320 H738 L722,290 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="817" y="282" class="label" fill="#1f2328">Revoked, expired</text><text x="817" y="301" class="sub" fill="#59636e">or user disabled?</text><rect x="956" y="260" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="1051" y="291" class="label" fill="#cf222e">401 Unauthorized</text><rect x="488" y="260" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="583" y="282" class="label" fill="#1f2328">Rotate</text><text x="583" y="301" class="sub" fill="#59636e">new token, old hash → used</text><path d="M488,388 a95,8 0 0 1 190,0 V432 a95,8 0 0 1 -190,0 Z" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><path d="M488,388 a95,8 0 0 0 190,0" fill="none" stroke="#8250df" stroke-width="1.5"/><text x="583" y="415" class="label" fill="#1f2328">user_sessions</text><rect x="254" y="260" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="349" y="282" class="label" fill="#1f2328">JWTService</text><text x="349" y="301" class="sub" fill="#59636e">new access JWT</text><rect x="20" y="260" width="190" height="60" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="115" y="282" class="label" fill="#1f2328">LoginResponse</text><text x="115" y="301" class="sub" fill="#59636e">same session expiry</text></g>
<g><text x="593" y="114" class="edge beside" fill="#59636e">allowed</text><text x="827" y="234" class="edge beside" fill="#59636e">yes</text><text x="700" y="282" class="edge" fill="#59636e">no</text><text x="593" y="354" class="edge beside" fill="#59636e">same row, new hash</text><text x="125" y="174" class="edge beside" fill="#59636e">access + new refresh token</text><text x="934" y="162" class="edge" fill="#59636e">no</text><text x="934" y="282" class="edge" fill="#59636e">yes</text></g>
<g><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M210,50 L254,50" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0757;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.0757"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M444,50 L488,50" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0757;0.1515;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0757;0.1515"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M583,80 L583,140" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1515;0.2272;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1515;0.2272"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M678,170 L722,170" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2272;0.3029;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2272;0.3029"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M817,200 L817,260" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3029;0.3786;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3029;0.3786"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M722,290 L678,290" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3786;0.4544;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3786;0.4544"/></circle><circle r="5" fill="#8250df" class="packet" opacity="0"><animateMotion path="M583,320 L583,380" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4544;0.5301;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4544;0.5301"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M488,290 L444,290" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5301;0.6058;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5301;0.6058"/></circle><circle r="5" fill="#0969da" class="packet" opacity="0"><animateMotion path="M254,290 L210,290" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6058;0.6816;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6058;0.6816"/></circle><circle r="5" fill="#1a7f37" class="packet" opacity="0"><animateMotion path="M115,260 L115,80" dur="5.94s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6816;0.7981;1"/><animate attributeName="opacity" dur="5.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6816;0.7981"/></circle></g>
