name: spring-boot-sample
services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    # Lets the app wait until Postgres accepts connections, not just until the container starts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  app:
    image: expense-tracker:1.0
    container_name: spring-app
    restart: unless-stopped
    ports:
      # Loopback only, for Bruno and debugging; browsers go through the web service
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Regex of reverse proxy IPs whose X-Forwarded-For is trusted; the web service's fixed IP by default, empty trusts no one
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172[.]28[.]0[.]10}
    # Same check as the Dockerfile HEALTHCHECK (curl is installed there); a proxy service can
    # wait on it with depends_on: app: condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - app-network

  web:
    image: expense-tracker-web:1.0
    container_name: spring-web
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      app-network:
        # Fixed so TRUSTED_PROXIES can name exactly this proxy, never the whole subnet
        ipv4_address: 172.28.0.10

volumes:
  pgdata:

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.28.0.0/24
